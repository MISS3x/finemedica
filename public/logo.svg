<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            /* Authentic double-beat heartbeat animation (tu-tu + pause) */
            @keyframes heartbeat {
                0% { transform: translate(250px, 248px) scale(2.3); }
                10% { transform: translate(250px, 248px) scale(3.0); }
                20% { transform: translate(250px, 248px) scale(2.3); }
                30% { transform: translate(250px, 248px) scale(2.85); }
                42% { transform: translate(250px, 248px) scale(2.3); }
                100% { transform: translate(250px, 248px) scale(2.3); }
            }

            /* Random pulsing/glowing connecting lines between organ nodes */
            @keyframes line-pulse-1 {
                0%, 100% { opacity: 0.25; stroke-width: 8px; }
                20% { opacity: 0.95; stroke-width: 13px; }
                40% { opacity: 0.3; stroke-width: 8px; }
            }
            @keyframes line-pulse-2 {
                0%, 100% { opacity: 0.3; stroke-width: 8px; }
                50% { opacity: 1; stroke-width: 14px; }
                70% { opacity: 0.3; stroke-width: 8px; }
            }
            @keyframes line-pulse-3 {
                0%, 100% { opacity: 0.2; stroke-width: 8px; }
                10% { opacity: 0.9; stroke-width: 13px; }
                80% { opacity: 0.25; stroke-width: 8px; }
            }
            @keyframes line-pulse-4 {
                0%, 100% { opacity: 0.35; stroke-width: 9px; }
                35% { opacity: 1; stroke-width: 14px; }
                60% { opacity: 0.35; stroke-width: 9px; }
            }

            .heart-node {
                animation: heartbeat 2s infinite ease-in-out;
                transform-box: fill-box;
                transform-origin: center;
            }

            .conn-line-1 { animation: line-pulse-1 2.4s infinite ease-in-out; }
            .conn-line-2 { animation: line-pulse-2 3.1s infinite ease-in-out 0.4s; }
            .conn-line-3 { animation: line-pulse-3 2.7s infinite ease-in-out 0.8s; }
            .conn-line-4 { animation: line-pulse-4 3.5s infinite ease-in-out 1.2s; }
            .conn-line-5 { animation: line-pulse-1 2.9s infinite ease-in-out 1.6s; }
            .conn-line-6 { animation: line-pulse-2 2.5s infinite ease-in-out 0.2s; }
            .conn-line-7 { animation: line-pulse-3 3.3s infinite ease-in-out 1.0s; }
            .conn-line-8 { animation: line-pulse-4 2.8s infinite ease-in-out 0.6s; }
        </style>

        <linearGradient id="heartGrad" x1="0" y1="-25" x2="0" y2="25" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FB7185" />
            <stop offset="100%" stop-color="#E11D48" />
        </linearGradient>

        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Connecting lines between Heart and Organ Nodes + Cross Connections -->
    <g stroke-linecap="round">
        <!-- Lines from Central Heart to Nodes -->
        <line x1="250" y1="250" x2="250" y2="80" stroke="#4DB6AC" class="conn-line-1" />
        <line x1="250" y1="250" x2="380" y2="140" stroke="#4A90E2" class="conn-line-2" />
        <line x1="250" y1="250" x2="440" y2="250" stroke="#4DB6AC" class="conn-line-3" />
        <line x1="250" y1="250" x2="380" y2="360" stroke="#4A90E2" class="conn-line-4" />
        <line x1="250" y1="250" x2="250" y2="420" stroke="#4A90E2" class="conn-line-5" />
        <line x1="250" y1="250" x2="120" y2="360" stroke="#2970B6" class="conn-line-6" />
        <line x1="250" y1="250" x2="70" y2="250" stroke="#2970B6" class="conn-line-7" />
        <line x1="250" y1="250" x2="120" y2="140" stroke="#4A90E2" class="conn-line-8" />

        <!-- Inter-organ random connections -->
        <line x1="120" y1="140" x2="250" y2="80" stroke="#4DB6AC" class="conn-line-3" />
        <line x1="250" y1="80" x2="380" y2="140" stroke="#4DB6AC" class="conn-line-5" />
        <line x1="380" y1="140" x2="440" y2="250" stroke="#4A90E2" class="conn-line-1" />
        <line x1="440" y1="250" x2="380" y2="360" stroke="#4A90E2" class="conn-line-7" />
        <line x1="380" y1="360" x2="250" y2="420" stroke="#4A90E2" class="conn-line-2" />
        <line x1="250" y1="420" x2="120" y2="360" stroke="#2970B6" class="conn-line-8" />
        <line x1="120" y1="360" x2="70" y2="250" stroke="#2970B6" class="conn-line-4" />
        <line x1="70" y1="250" x2="120" y2="140" stroke="#4A90E2" class="conn-line-6" />

        <!-- Cross organ connections -->
        <line x1="120" y1="140" x2="380" y2="360" stroke="#3B82F6" opacity="0.3" class="conn-line-2" />
        <line x1="380" y1="140" x2="120" y2="360" stroke="#3B82F6" opacity="0.3" class="conn-line-5" />
    </g>

    <!-- Organ Nodes & Central Heart (NO circle behind heart) -->
    <g stroke="none">
        <!-- Surrounding Organ Nodes (smooth breathing animation) -->
        <circle cx="120" cy="140" r="38" fill="#4A90E2">
             <animate attributeName="r" values="38; 45; 38" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>

        <circle cx="250" cy="80" r="24" fill="#4DB6AC">
            <animate attributeName="r" values="24; 30; 24" dur="2.6s" begin="-0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>

        <circle cx="380" cy="140" r="38" fill="#2970B6">
            <animate attributeName="r" values="38; 45; 38" dur="3.4s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="440" cy="250" r="24" fill="#4A90E2">
            <animate attributeName="r" values="24; 30; 24" dur="2.8s" begin="-0.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="380" cy="360" r="38" fill="#4A90E2">
            <animate attributeName="r" values="38; 45; 38" dur="3.1s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="250" cy="420" r="24" fill="#4A90E2">
            <animate attributeName="r" values="24; 29; 24" dur="2.9s" begin="-1.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="120" cy="360" r="38" fill="#2970B6">
            <animate attributeName="r" values="38; 45; 38" dur="3.6s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="70" cy="250" r="24" fill="#2970B6">
            <animate attributeName="r" values="24; 29; 24" dur="2.7s" begin="-1.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>

        <!-- Central Heart Node - STRICTLY ONLY THE HEART (NO CIRCLE AT ALL) -->
        <g class="heart-node" filter="url(#glow)">
            <path
                d="M 0 16 C -1.5 14.5 -22 5 -22 -10 C -22 -21 -12 -27 0 -15 C 12 -27 22 -21 22 -10 C 22 5 1.5 14.5 0 16 Z"
                fill="url(#heartGrad)"
            />
        </g>
    </g>
</svg>
