<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @keyframes heartbeat {
                0% { transform: translate(250px, 245px) scale(2.2); }
                14% { transform: translate(250px, 245px) scale(2.6); }
                28% { transform: translate(250px, 245px) scale(2.2); }
                42% { transform: translate(250px, 245px) scale(2.5); }
                70% { transform: translate(250px, 245px) scale(2.2); }
                100% { transform: translate(250px, 245px) scale(2.2); }
            }
            @keyframes pulse-ring {
                0% { r: 50px; opacity: 0.8; }
                80% { r: 85px; opacity: 0; }
                100% { r: 85px; opacity: 0; }
            }
            .heart-node {
                animation: heartbeat 1.5s infinite ease-in-out;
                transform-box: fill-box;
                transform-origin: center;
            }
            .heart-ring {
                animation: pulse-ring 2.2s infinite ease-out;
                transform-origin: 250px 250px;
            }
        </style>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Connecting lines -->
    <g stroke-width="12" stroke-linecap="round">
        <line x1="250" y1="250" x2="250" y2="80" stroke="#4DB6AC"/>
        <line x1="250" y1="250" x2="380" y2="140" stroke="#4A90E2"/>
        <line x1="250" y1="250" x2="440" y2="250" stroke="#4DB6AC"/>
        <line x1="250" y1="250" x2="380" y2="360" stroke="#4A90E2"/>
        
        <line x1="250" y1="250" x2="120" y2="140" stroke="#4A90E2"/>
        <line x1="250" y1="250" x2="70" y2="250" stroke="#2970B6"/>
        <line x1="250" y1="250" x2="120" y2="360" stroke="#2970B6"/>
        <line x1="250" y1="250" x2="250" y2="420" stroke="#4A90E2"/>

        <!-- Outer connections -->
        <line x1="120" y1="140" x2="250" y2="80" stroke="#4DB6AC"/>
        <line x1="380" y1="140" x2="440" y2="250" stroke="#4A90E2"/>
    </g>

    <!-- Nodes & Heart -->
    <g stroke="none">
        <!-- Heart Pulse Ring -->
        <circle cx="250" cy="250" r="55" fill="#E11D48" class="heart-ring" opacity="0.4" />

        <!-- Surrounding Nodes (smooth breathing animation) -->
        <circle cx="120" cy="140" r="38" fill="#4A90E2">
             <animate attributeName="r" values="38; 45; 38" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>

        <circle cx="250" cy="80" r="24" fill="#4DB6AC">
            <animate attributeName="r" values="24; 30; 24" dur="2.6s" begin="-0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>

        <circle cx="380" cy="140" r="38" fill="#2970B6">
            <animate attributeName="r" values="38; 45; 38" dur="3.4s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="440" cy="250" r="24" fill="#4A90E2">
            <animate attributeName="r" values="24; 30; 24" dur="2.8s" begin="-0.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="380" cy="360" r="38" fill="#4A90E2">
            <animate attributeName="r" values="38; 45; 38" dur="3.1s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="250" cy="420" r="24" fill="#4A90E2">
            <animate attributeName="r" values="24; 29; 24" dur="2.9s" begin="-1.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="120" cy="360" r="38" fill="#2970B6">
            <animate attributeName="r" values="38; 45; 38" dur="3.6s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
        
        <circle cx="70" cy="250" r="24" fill="#2970B6">
            <animate attributeName="r" values="24; 29; 24" dur="2.7s" begin="-1.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>

        <!-- Central Heart Element (Pulsing Heartbeat) -->
        <g className="heart-node" filter="url(#glow)">
            {/* Background circle backing for heart contrast */}
            <circle cx="0" cy="0" r="26" fill="#F43F5E" />
            {/* Smooth SVG Heart Path */}
            <path
                d="M 0 10 C -1.2 8.9 -18 3 -18 -8 C -18 -16.5 -10 -22 0 -13 C 10 -22 18 -16.5 18 -8 C 18 3 1.2 8.9 0 10 Z"
                fill="#FFFFFF"
            />
        </g>
    </g>
</svg>
